# Веб-версия приложения → GitHub Pages при каждом пуше в main.
# Мобильные сборки здесь не делаются: для них — EAS Build (docs/09-publishing.md).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Сломанный код не уезжает: линтер, типы, тесты.
      - run: npm run check
      # Сайт лежит в подпапке /ritm/ — пути к скриптам должны её учитывать (app.config.js).
      - run: npm run export:web
        env:
          EXPO_BASE_URL: /ritm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
